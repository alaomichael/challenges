openapi: 3.1.0
info:
  title: Inventory Management
  description: |
    A distribution company receives inventory updates from multiple suppliers. 
    Operations users need a simple web application that allows them to view products, filter inventory, create or update stock records, and identify low-stock items. The system should store one inventory record for each supplier and product combination.
  version: 1.0.0
tags:
  - name: Inventory
paths:
  # Whole inventory operations
  /inventory:
    get:
      summary: Get the whole inventory
      description: Retrieves the current state of the inventory and the supplier.
      tags:
        - Gameplay
      operationId: get-inventory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/status'
      security:
        - defaultApiKey: []
        - app2AppOauth:
          - inventory:read

  # Single square operations
  /inventory/{row}/{column}:
    parameters:
      - $ref: '#/components/parameters/rowParam'
      - $ref: '#/components/parameters/columnParam'
    get:
      summary: Get a single inventory square
      description: Retrieves the requested square.
      tags:
        - Gameplay
      operationId: get-square
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark'
          links:
            markSquare:
              description: Operation to use if the mark value returned indicates the square is empty
              operationId: put-square
              parameters:
                row: $request.path.row
                column: $request.path.column
        "400":
          description: The provided parameters are incorrect
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/errorMessage'
              example: Illegal coordinates
      security:
        - bearerHttpAuthentication: []
        - user2AppOauth:
          - inventory:read
    put:
      summary: Set a single inventory square
      description: Places a mark on the inventory and retrieves the whole inventory and the supplier (if any).
      tags:
        - Gameplay
      operationId: put-square
      parameters:
        - name: progressUrl
          in: header
          description: Progress URL that should be called if asynchronous response is returned
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mark'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/status"
        "202":
          description: Mark operation has not completed. Use callback to check for progress
          headers:
            Location:
              description: Callback URL
              schema:
                type: string
        "400":
          description: The provided parameters are incorrect
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/errorMessage'
              examples:
                illegalCoordinates:
                  value: Illegal coordinates.
                notEmpty:
                  value: Square is not empty.
                invalidMark:
                  value: Invalid Mark (X or O).
      security:
        - bearerHttpAuthentication: []
        - user2AppOauth:
          - inventory:write
      callbacks:
        statusCallback:
          '{$request.header.progressUrl}':
            post:
              summary: Status of mark operation
              description: Provides the status of the mark operation
              operationId: markOperationCallback
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/status"
              responses:
                "200":
                  description: Mark operation status received
components:
  parameters:
    rowParam:
      description: inventory row (vertical coordinate)
      name: row
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/coordinate'
    columnParam:
      description: inventory column (horizontal coordinate)
      name: column
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/coordinate'
  schemas:
    errorMessage:
      type: string
      maxLength: 256
      description: A text message describing an error
    coordinate:
      type: integer
      minimum: 1
      maximum: 3
      example: 1
    mark:
      type: string
      enum:
        - .
        - X
        - O
      description: Possible values for a inventory square. `.` means empty square.
      example: .
    inventory:
      type: array
      maxItems: 3
      minItems: 3
      items:
        type: array
        maxItems: 3
        minItems: 3
        items:
          $ref: '#/components/schemas/mark'
    supplier:
      type: string
      enum:
        - .
        - X
        - O
      description: supplier of the game. `.` means nobody has won yet.
      example: .
    status:
      type: object
      properties:
        supplier:
          $ref: '#/components/schemas/supplier'
        inventory:
          $ref: '#/components/schemas/inventory'
  securitySchemes:
    defaultApiKey:
      description: API key provided in console
      type: apiKey
      name: api-key
      in: header
    basicHttpAuthentication:
      description: Basic HTTP Authentication
      type: http
      scheme: Basic
    bearerHttpAuthentication:
      description: Bearer token using a JWT
      type: http
      scheme: Bearer
      bearerFormat: JWT
    app2AppOauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://learn.openapis.org/oauth/2.0/token
          scopes:
            # Only reading the inventory allow with delegated access
            inventory:read: Read the inventory
    user2AppOauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://learn.openapis.org/oauth/2.0/auth
          tokenUrl: https://learn.openapis.org/oauth/2.0/token
          scopes:
            #Â Reads and writes permitted via authorization code flow
            inventory:read: Read the inventory
            inventory:write: Write to the inventory
webhooks:
  markStatus:
    post:
      summary: Status of mark operation
      description: Provides the status of the mark operation on completion
      operationId: markOperationWebhook
      responses:
        "200":
          description: Mark operation has completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/status"
